services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: postgres18-ext:18-alpine
    container_name: postgres18
    restart: unless-stopped

    ports:
      - "${TAILSCALE_IP}:5432:5432"

    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_HOST_AUTH_METHOD: "md5"

    volumes:
      - /home/docker-data/postgres18:/var/lib/postgresql
      - /home/docker-data/postgres18-tablespaces/neon_vertex_tbs:/var/lib/postgresql/tablespaces/neon_vertex_tbs
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro

    command: >
      postgres
      -c shared_buffers=2048MB
      -c effective_cache_size=6144MB
      -c work_mem=40MB
      -c maintenance_work_mem=512MB
      -c max_worker_processes=8
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c random_page_cost=4.0
      -c effective_io_concurrency=2
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=50
      -c log_min_duration_statement=1000
      -c log_timezone=America/Sao_Paulo
      -c timezone=America/Sao_Paulo
      -c listen_addresses=*
      -c hba_file=/etc/postgresql/pg_hba.conf

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - home-network

networks:
  home-network:
    external: true